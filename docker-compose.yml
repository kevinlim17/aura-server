version: '3.8'

services:
  # ==========================================================================
  # Aura Server Application
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-server
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/aura_db
      - DB_DRIVER=org.postgresql.Driver
      - DB_USER=aura_user
      - DB_PASSWORD=${DB_PASSWORD:-aura_password}
      - DB_MAX_POOL_SIZE=10
      - REDIS=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TTS_API_KEY=${TTS_API_KEY}
      - VISION_API_KEY=${VISION_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - AUDIO_STORAGE_PATH=/app/storage/audio
    volumes:
      - audio-storage:/app/storage/audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aura-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    environment:
      - POSTGRES_DB=aura_db
      - POSTGRES_USER=aura_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-aura_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - aura-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_user -d aura_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: aura-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - aura-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# ==========================================================================
# Networks
# ==========================================================================
networks:
  aura-network:
    driver: bridge

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  postgres-data:
  redis-data:
  audio-storage:
